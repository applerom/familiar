# Первый вечер. Ирина (хозяйка) рассказывает агенту; агент записывает, кто что видел сам.
id = "irina-2026-11-12"
told_by = "Ирина Викторовна Соколова (хозяйка)"
date = "2026-11-12"

[[items]]
id = "ir-emma-life"
text = "Бабушка Эмма Богдановна Корнеева, в девичестве Шмидт, родилась в 1931 году на Волге, в немецком селе. Умерла в 2009 году в Тольятти, я была на похоронах."
strength = "firm"
witness = "внучка, жила рядом с бабушкой до 2009 года"

[[items]]
id = "ir-deport"
text = "В сентябре 1941 года всех немцев из их села выселили, бабушку с родителями и братом увезли в Казахстан, в Павлодарскую область. Ехали в товарном вагоне почти месяц."
strength = "hearsay"
witness = "рассказывала бабушка Эмма, в последние годы жизни"

[[items]]
id = "ir-gottlieb"
text = "Прадеда звали Готлиб, по-русски Богдан, поэтому у бабушки в паспорте отчество Богдановна. Его забрали в трудармию, и он не вернулся. Где и когда умер, никто не знает."
strength = "hearsay"
witness = "рассказывала бабушка Эмма; что отчество поменяли, знает мама"

[[items]]
id = "ir-maria"
text = "Прабабушку звали Мария. Девичья фамилия то ли Келлер, то ли Кёлер, мама точно не помнит. Умерла в Казахстане, когда мама была маленькой."
strength = "hearsay"
witness = "мама Людмила, слышала от бабушки"

[[items]]
id = "ir-friedrich"
text = "У бабушки был младший брат Фридрих, дома его звали Федей. Когда прабабушку тоже забрали в трудармию, его отдали в детский дом. В семье о нём не говорили. Один раз, году в 1985, бабушка сказала маме, что Федя нашёлся, но знаться не захотел, и больше об этом не говорила."
strength = "hearsay"
witness = "мама Людмила, слышала от бабушки один раз, около 1985 года"

[[items]]
id = "ir-andrey"
text = "Дед Андрей Петрович Корнеев приехал в Казахстан на целину из Курской области, там познакомился с бабушкой. Умер в 1994 году в Тольятти."
strength = "firm"
witness = "внучка, знала деда"

[[items]]
id = "ir-mama"
text = "Мама, Людмила Андреевна, в девичестве Корнеева, по мужу Соколова, родилась в 1957 году в Павлодаре. В 1976 году семья переехала в Тольятти."
strength = "firm"
witness = "дочь; у мамы есть свидетельство о рождении"

[[items]]
id = "ir-nina"
text = "Тётя Нина, мамина младшая сестра, по мужу Вагнер, с 1995 года живёт в Германии. Для переезда она собирала бабушкины документы, и они, кажется, остались у неё."
strength = "firm"
witness = "племянница; про документы — со слов мамы"

