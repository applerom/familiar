[record]
title = "Справка о реабилитации Корнеевой (Шмидт) Эммы Готлибовны, УВД Павлодарской обл., 1994, с немецким переводом"
language = ["ru", "de"]
reading = """[Лист 1, русский, бланк УВД, машинопись]
СПРАВКА О РЕАБИЛИТАЦИИ
Выдана гр. Корнеевой (Шмидт) Эмме Готлибовне, 1931 года рождения, уроженке с. Гнаденфлюр Палласовского кантона АССР Немцев Поволжья, в том, что она в 1941 году по национальному признаку была выселена в составе семьи: отец Шмидт Готлиб Иванович, 1899 г.р., мать Шмидт Мария Генриховна, 190[...] г.р., брат Шмидт Фр[...], 1935 г.р. — в Павлодарскую область Казахской ССР, Лебяжинский район.
Состояла на учёте спецпоселения с 1941 г. по 1955 г.
На основании ст. 3 Закона РФ от 18 октября 1991 г. «О реабилитации жертв политических репрессий» реабилитирована.
Начальник ИЦ УВД Павлодарской обл. [подпись неразборчива]
12.05.1994. М.П.

[Лист 2, немецкий, заверенный перевод, 1995]
Bescheinigung über die Rehabilitierung
Ausgestellt für Frau Korneeva (Schmidt) Emma, Tochter des Gottlieb, geb. 1931 in Gnadenflur, Kanton Pallasowka, ASSR der Wolgadeutschen ... im Familienverband: Vater Schmidt Gottlieb, geb. 1899, Mutter Schmidt Maria, geb. 190[...], Bruder Schmidt Friedrich, geb. 1935 ... nach dem Gebiet Pawlodar, Kasachische SSR, Bezirk Lebjashje, ausgesiedelt."""

[record.source]
holder = "Нина Вагнер (урожд. Корнеева), Германия"
received = "2026-11-16, фото в мессенджере от тёти Нины"
description = "Русский бланк УВД 1994 года, машинопись, печать; к нему приложен заверенный перевод на немецкий 1995 года для оформления переезда. Сгиб на русском листе проходит по году рождения матери и по имени брата."

[record.fields]
"Кому выдана" = "Корнеевой (Шмидт) Эмме Готлибовне, 1931 года рождения"
"Место рождения" = "с. Гнаденфлюр Палласовского кантона АССР Немцев Поволжья"
"Состав семьи (рус.)" = "отец Шмидт Готлиб Иванович, 1899 г.р., мать Шмидт Мария Генриховна, 190[...] г.р., брат Шмидт Фр[...], 1935 г.р."
"Состав семьи (нем.)" = "Vater Schmidt Gottlieb, geb. 1899, Mutter Schmidt Maria, geb. 190[...], Bruder Schmidt Friedrich, geb. 1935"
"Куда выселена" = "Павлодарская область Казахской ССР, Лебяжинский район"
"Спецпоселение" = "с 1941 г. по 1955 г."
"Выдана" = "Начальник ИЦ УВД Павлодарской обл., 12.05.1994"

[[record.doubt]]
field = "Состав семьи (рус.)"
text = "Год рождения матери и имя брата на русском листе на сгибе: читается '190', последняя цифра стёрта; имя брата 'Фр' и дальше стёрто. Немецкий перевод даёт 'Friedrich', но переводчик в 1995 году мог дописать имя со слов семьи — это не независимое чтение."

[[record.doubt]]
field = "Кому выдана"
text = "Отчество здесь Готлибовна, в свидетельстве 1957 года — Богдановна. Это одно лицо: совпадают имя, год, муж по фамилии и семья; русская замена отчества в 1950-е годы обычна. Обе формы — как написано."

