event_immigration = "przyjazd"
event_occupation = "praca"
confirmation = "Co oznacza potwierdzenie\n\nProgram sprawdza formę materiału: osoby i dokumenty mają lokalne odpowiedniki, słabe przypuszczenia nie są przedstawione jako przyjęte fakty, a tekst nie zawiera ukrytych znaczników. Ustala, kogo pokazuje strona, także na zdjęciach i w dokumentach. Widok rodzinny opowiada o wszystkich bez pytań o zgodę. Publicznie o żyjących i osobach o nieznanym statusie podaje tylko imię, nazwisko i pokrewieństwo. Adresów ani dokumentów dotyczących żyjących nie można w ten sposób udostępnić. Obrazy żyjących lub dzieci nie trafiają do generatora. Te kontrole dotyczą danych, nie dowodzą prawdy historycznej.\n\nPrzed potwierdzeniem gospodarz lub czytelnik inny niż autor musi przeczytać całą stronę, część dla dzieci i podstawy opowieści, a także obejrzeć ilustracje i podpisy we wszystkich pokazywanych językach. Trzeba sprawdzić, czy tekst nie pokazuje adresów ani dokumentów żyjących, pomija zamknięte tematy rodzinne, opiera sceny na świadectwach i nie obwinia całego narodu lub wyznania. Trzeba sprawdzić osoby w kadrze, oznaczenia rekonstrukcji oraz sprzeczności między dokumentami i przypuszczeniami. Automatyczna kontrola może przeoczyć parafrazę, zbieżność nazwisk i sens zdania. Brak zasobów językowych oznacza, że tych kontroli nie wykonano.\n\nProszę potwierdzać tylko to, co rzeczywiście przeczytano. Program wymaga wskazanego czytelnika innego niż autor; nie potrafi sprawdzić uczciwości ani niezależności lektury. Bez lektury strona pozostaje szkicem, a zwykły eksport dla czytelników jest wstrzymany. Świadome udostępnienie przez gospodarza wymaga osobnej zapisanej decyzji i nie omija błędu kontroli danych.\n\nZmiana pokazywanej strony albo istotnych danych o bezpieczeństwie unieważnia potwierdzenie. Zmieniony materiał trzeba przeczytać ponownie. O publikacji decyduje gospodarz; lokalny program nie może wycofać kopii już przekazanej poza nim."

