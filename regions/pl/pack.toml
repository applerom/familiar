years = [0, 2026]
record_languages = ["pl"]
files = { answers = "answers.md" }
answers = ["RP-60", "RP-66"]

[proper_names]
place = []
institution = []
publication = []
term = []

[[gap]]
what = "нет польских списков голоса отчёта, простого языка и границ предложений"
next = "нужно отдельное польское чтение и языковой справочник; русские шаблоны не переносить переводом"

[[gap]]
what = "нет таблицы имён и транслитерации"
next = "сохранять оригинальную форму с диакритикой; соответствия имён не угадывать"

[[gap]]
what = "нет полного польского склонения; суффиксы только признаки исторической формы"
next = "для восстановления основной фамилии нужны исходная запись и контекст; не снимать суффикс автоматически"

[language]
schema_version = 1
tag = "pl"
status = "reported"
basis = "обобщённые языковые наблюдения; не полный словарь и не автоматический морфологический анализ"
usage = "списки — признаки для проверки и чтения; запрет и тяжесть задаёт каталог и слой семьи; документальные цитаты сохраняются буквально"

[language.writing]
purpose = "сохранять буквальное польское написание, включая диакритические знаки"
rule = "TASTE-NAMES"
check = "name-forms"
alphabet = "латиница с польской диакритикой"
diacritics = "ąćęłńóśźżĄĆĘŁŃÓŚŹŻ"
normalization = "NFC"
policy = "имена берутся из исходной записи; упрощённая графика годится для поиска, не для переписывания имени"

[language.surnames]
purpose = "распознавать кандидаты на историческую женскую форму без подмены основной фамилии"
rule = "TASTE-NAMES"
check = "name-forms"
operation = "detect-only"
policy = "суффикс не доказывает вдовство, родство или девичью фамилию; окончание может быть частью неизменяемой фамилии; цитаты не менять"

[[language.surname_forms]]
id = "married"
pattern = "\\b[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+owa\\b"
meaning = "историческая форма замужней женщины; не свидетельство вдовства"
action = "review-only"

[[language.surname_forms]]
id = "daughter"
pattern = "\\b[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+ówna\\b"
meaning = "историческая дочерняя форма; основание фамилии проверяется по документу"
action = "review-only"

[[language.surname_forms]]
id = "daughter-plain"
pattern = "\\b[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+owna\\b"
meaning = "написание без диакритики: только кандидат на форму с диакритикой"
action = "review-only"

[[language.surname_forms]]
id = "daughter-anka"
pattern = "\\b[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+anka\\b"
meaning = "возможная историческая женская форма; совпадение окончания особенно неоднозначно"
action = "review-only"

