# START_MODULE_CONTRACT: MOD-LANGUAGE-RU
# PURPOSE: Separate reusable Russian voice cues, reading aids and surname paradigms from a household choice.
# PRD_REF: docs/PRD.md#REGION-PACK
# INVARIANTS:
# - ru resources load only in their explicitly selected language scope [review: engine lead]
# - ru data contains no family names, places or private locators [review: pack keeper]
# - ru host wording has the English keys and placeholders and no working vocabulary [review: pack keeper]
# - a Russian family receives its letter, next step and confirmation in Russian [review: pack keeper]
# CHANGES_WITH:
# - MOD-READER-GRAPH (reader_intake notice keys)
# - regions/ru/kinship.json (reader words, explanations and table)
# - MOD-REGION-CONTRACT
# - docs/PRD.md#RULES-MODEL
# :END_MODULE_CONTRACT
schema_version = 1

[pack]
id = "ru"
kind = "language"
title = "русский язык семейного рассказа"
version = "0.2.0"
updated = 2026-11-14
countries = []
territory = "язык рассказа; без привязки к территории"
years = [0, 2026]
record_languages = ["ru"]
files = {}
answers = []

[proper_names]
place = []
institution = []
publication = []
term = []

[[gap]]
what = "проверки языка в коде ещё не читают эти списки"
next = "подключить данные по явному языку поля; сохранить режимы, исключения и буквальные цитаты"

[[gap]]
what = "морфология охватывает только явно названные регулярные классы"
next = "для остальных фамилий нужны подтверждённые формы или морфологический анализ; автоматическую догадку не делать"

[[gap]]
what = "нет словаря имён, транслитерации и ударений"
next = "добавлять по языковому справочнику, без имён конкретной семьи"

[[gap]]
what = "разделитель предложений эвристический: сокращения и инициалы не разобраны"
next = "добавить обработку сокращений до переноса проверки абзацев"

[language]
schema_version = 1
tag = "ru"
status = "reported"
basis = "обобщённые языковые наблюдения; не полный словарь и не автоматический морфологический анализ"
usage = "списки — признаки для проверки и чтения; запрет и тяжесть задаёт каталог и слой семьи; документальные цитаты сохраняются буквально"

[language.lexicon.reader_address]
rule = "TASTE-READER-NEUTRAL"
check = "reader-address"
purpose = "формы обращения и притяжательных местоимений; нейтральность выбирает семья"
patterns = ["\\bнаш(а|е|и|его|ей|ему|им|их|ими|у)?\\b(?! верси)", "\\bваш(а|е|и|его|ей|ему|им|их)?\\b", "\\bтво(й|я|ё|е|и|его|ей|ему|им|их)\\b", "\\bты\\b"]
flags = ["IGNORECASE"]
fields = ["text", "kids", "ask", "facts", "extra", "title", "kidstitle", "caption"]
quoted = "literal-exempt"

[language.lexicon.missing_records]
rule = "TASTE-NARRATOR-VOICE"
check = "narrator-voice"
purpose = "слова об отсутствии записи; не доказательство отсутствия события"
patterns = ["не найден", "не нашл[оа]сь", "нет записи", "бумаг нет", "записи нет", "в книгах нет", "книг[аи]? (тех лет )?пропал"]
flags = ["IGNORECASE"]
fields = ["text", "kids", "ask", "facts", "extra"]
quoted = "literal-exempt"

[language.lexicon.unresolved]
rule = "TASTE-NARRATOR-VOICE"
check = "narrator-voice"
purpose = "язык нерешённого вопроса; уместность зависит от слоя рассказа"
patterns = ["не установлен", "не определен", "не известно", "\\bнеизвестн(о|ы)\\b"]
flags = ["IGNORECASE"]
fields = ["text", "kids", "ask", "facts", "extra"]
quoted = "literal-exempt"

[language.lexicon.investigator]
rule = "TASTE-NARRATOR-VOICE"
check = "narrator-voice"
purpose = "слова сомнения и работы исследователя; самостоятельные слова в сцене могут быть уместны"
patterns = ["\\bвидимо\\b", "\\bнаверное\\b", "по всей видимости", "мы (этого )?(точно )?не знаем", "бумаг нет", "книги молчат", "\\bмы видим\\b", "\\bзапомним\\b", "наша версия", "документов у нас", "осталось только в семейной памяти", "никто тогда не знал", "в книге записали", "скорее всего", "\\bможет быть\\b", "\\bвозможно\\b", "никто не записал", "уже не узнать"]
flags = ["IGNORECASE"]
fields = ["text", "kids", "ask", "facts", "extra", "caption"]
quoted = "literal-exempt"

[language.lexicon.revision_voice]
rule = "TASTE-NARRATOR-VOICE"
check = "narrator-voice"
purpose = "голос пересмотра прежнего текста"
patterns = ["позже выяснилось", "раньше мы (считали|думали)", "как выяснилось"]
flags = ["IGNORECASE"]
fields = ["text", "kids", "ask", "facts", "extra"]
quoted = "literal-exempt"

[language.lexicon.spoilers]
rule = "CRAFT-ARC"
check = "spoilers"
purpose = "обороты забегания вперёд; подсказка читателю, не автоматический запрет будущего времени"
patterns = ["так будет", "пройд(ёт|ут) (много )?(лет|годы)", "забегая вперёд", "ещё не знал[аи]?, что", "потом и назов", "будут одними"]
flags = ["IGNORECASE"]
fields = ["text", "kids", "ask", "facts", "extra"]
quoted = "literal-exempt"

[language.lexicon.statistics]
rule = "CRAFT-FACT-PLUS-NORM"
check = "statistics-voice"
purpose = "словесные доли и обобщения; числовая опора и роль в сцене требуют чтения"
patterns = ["в основном", "как правило", "большинство (семей|людей|крестьян|жителей)", "\\bкажд(ый|ая|ое) (второй|третий|четвёртый|пятый|десятый|вторая|третья|десятая)\\b", "один из (десяти|пяти|трёх|двух)", "в среднем", "чаще всего"]
flags = ["IGNORECASE"]
fields = ["text", "kids", "ask", "facts", "extra"]
quoted = "literal-exempt"

[language.lexicon.dated_words]
rule = "TASTE-PLAIN-LANGUAGE"
check = "plain-language"
purpose = "исторические слова: предложить объяснение в той же фразе, не запрещать эпоху"
patterns = ["\\bнарочн(ый|ые|ого|ых)\\b", "\\bсветец", "\\bбарышник", "\\bвыгон", "\\bдевиц[аеуы]?\\b", "\\bповинност", "\\bгорячк", "\\bурожд[её]нн", "при хозяйстве", "ходил в холостых", "\\bбежанств", "при отце"]
flags = ["IGNORECASE"]
fields = ["text", "kids", "ask", "facts", "extra", "title", "kidstitle", "caption"]
quoted = "literal-exempt"

[language.lexicon.memory_teller]
rule = "TASTE-NARRATOR-VOICE"
check = "narrator-voice"
purpose = "названный рассказчик памяти; его видимость выбирает семья"
patterns = ["(по словам|\\bсо слов) (мам|пап|отц|матер|бабушк|дедушк|сестр|брат|тёт|дяд|семь|родн)", "так помнит семья", "помнят до сих пор", "\\b(семья|родные|дети|внуки|мама|бабушка|дедушка|сёстры|в семье)\\s+(\\w+\\s+){0,2}?(помн|вспомина)\\w*"]
flags = ["IGNORECASE"]
fields = ["text", "kids", "ask", "facts", "extra", "caption"]
quoted = "literal-exempt"

[language.lexicon.kids_doubt]
rule = "TASTE-KIDS"
check = "kids-block"
purpose = "сомнение и насилие в детском тексте; бережность определяется контекстом и настройками"
patterns = ["наша версия", "мы думаем"]
flags = ["IGNORECASE"]
fields = ["kids", "ask", "kidstitle"]
quoted = "literal-exempt"

[language.lexicon.hard_topics]
rule = "TASTE-KIDS"
check = "kids-block"
purpose = "сомнение и насилие в детском тексте; бережность определяется контекстом и настройками"
patterns = ["\\bказн", "\\bрасстрел", "\\bвешател", "\\bбил[иа]?\\b", "\\bкров[ьи]\\b", "\\bубил", "\\bпытк"]
flags = ["IGNORECASE"]
fields = ["kids", "ask", "kidstitle"]
quoted = "literal-exempt"

[language.lexicon.document_actor]
rule = "CRAFT-DOCUMENT-SUPPORTS"
check = ""
purpose = "документ как грамматический герой; допустим, когда документ и есть сюжет; список для чтения роли, машинной проверки в каталоге нет"
patterns = ["\\b(перепись|ревизия|книга|список|карточка|метрика)\\s+(\\w+\\s+){0,3}?(записал\\w*|насчитал\\w*|пришл\\w*|назвал\\w*|говорит|молч\\w*|сообщ\\w*|показыва\\w*|помнит)"]
flags = ["IGNORECASE"]
fields = ["text", "kids", "ask", "facts", "extra"]
quoted = "literal-exempt"

[language.lexicon.illness]
rule = "TASTE-HARDSHIP-DENSITY"
check = "review:reviewer"
purpose = "смерть и болезнь в одной фразе; причину смерти не заменять без чтения"
patterns = ["\\bумер\\w*[^.!?]{0,60}\\b(от|в)\\s+(тиф|холер|горячк|чахотк|туберкул|осп|дифтер|скарлат|воспален)", "\\b(тиф|холер|горячк|чахотк|туберкул)\\w*[^.!?]{0,60}\\bумер"]
flags = ["IGNORECASE"]
fields = ["text", "kids", "ask", "facts", "extra"]
quoted = "literal-exempt"

[language.lexicon.service_keys]
rule = "TRUST-02"
check = "reader-surface"
purpose = "следы сборки в видимом тексте; технические ключи не язык семьи"
patterns = ["[{}]", "\\bR-[A-Z0-9-]{4,}", "@I\\d+@", "\\bundefined\\b", "\\bnull\\b", "\\bTODO\\b"]
flags = ["IGNORECASE"]
fields = ["text", "kids", "ask", "facts", "extra", "title", "kidstitle", "header", "caption", "doctitle"]
quoted = "literal-exempt"

[language.lexicon.workshop]
rule = "CRAFT-CAPTIONS-AND-MORE"
check = "captions-and-more"
purpose = "следы мастерской в подробностях; архивный источник словами допустим"
patterns = ["`", "\\b[\\w.-]+\\.(md|json|py|txt|csv|png)\\b", "\\b(stories|services|versions|research|places|cases)/", "(?<!\\d )\\b(?-i:[LFRD])\\d{1,2}\\b", "вычитк", "\\bпо панели\\b", "панел\\w* читател", "\\bсервис", "второе чтение", "\\bпо ревью\\b", "решени\\w* руководител", "@[IF]\\d+@", "\\b(possible|probable)\\b", "\\bv\\d\\b"]
flags = ["IGNORECASE"]
fields = ["more"]
quoted = "literal-exempt"

[language.lexicon.report_voice]
rule = "TASTE-NARRATOR-VOICE"
check = "narrator-voice"
purpose = "канцелярский голос отчёта вместо действия; в цитате документа допустим"
patterns = ["\\bсогласно записи\\b", "\\bзафиксирован\\w*", "\\bв соответствии с\\b", "\\bосуществлял\\w*", "\\bявлял\\w*", "\\bпроживал\\w*"]
flags = ["IGNORECASE"]
fields = ["text", "kids", "extra"]
quoted = "literal-exempt"

[language.lexicon.caption_1]
rule = "CRAFT-CAPTIONS-AND-MORE"
check = "captions-and-more"
purpose = "шифры, авторские кредиты или служебные пометки: проверить нужный слой подписи"
patterns = ["\\bакт\\s*№?\\s*\\d", "№\\s*\\d", "\\bDGS\\b", "\\bкадр\\s*\\d", "\\bизобр\\.", "\\bi=\\d", "\\bкат\\.\\s*\\d", "лицензи", "\\bCC[ -]BY", "Public domain", "общественное достояние", "\\bsygn", "\\bфонд\\s*\\d", "\\bпоз\\.\\s*\\d"]
flags = ["IGNORECASE"]
fields = ["caption", "doctitle"]
quoted = "literal-exempt"

[language.lexicon.caption_2]
rule = "CRAFT-CAPTIONS-AND-MORE"
check = "captions-and-more"
purpose = "шифры, авторские кредиты или служебные пометки: проверить нужный слой подписи"
patterns = ["\\b(фото|снимок|рисунок|картина|гравюра|литография|портрет|открытка|автохром)\\s+(\\w+\\s+){0,2}?(?-i:[А-ЯЁA-Z])[а-яёa-z]+\\b"]
flags = ["IGNORECASE"]
fields = ["caption"]
quoted = "literal-exempt"

[language.lexicon.caption_3]
rule = "TRUST-02"
check = "reader-surface"
purpose = "шифры, авторские кредиты или служебные пометки: проверить нужный слой подписи"
patterns = ["склейк", "разворот", "в две полосы", "нужна только", "\\bсм\\. ", "\\bр\\d{2}\\b"]
flags = ["IGNORECASE"]
fields = ["caption", "doctitle"]
quoted = "literal-exempt"

[language.lexicon.title_time]
rule = "TASTE-TITLES"
check = "titles"
purpose = "лексика времени для заголовков; допустимость задаёт настройка заголовков"
patterns = ["\\d", "\\b(зим|весн|осен)\\w*|\\bлет(о|ом|ний|няя|нее|них)\\b", "\\b(январ|феврал|март|апрел|мая|июн|июл|август|сентябр|октябр|ноябр|декабр)\\w*"]
flags = ["IGNORECASE"]
fields = ["text", "title", "caption"]
quoted = "literal-exempt"

[language.lexicon.title_document]
rule = "TASTE-TITLES"
check = "titles"
purpose = "названия документов в заголовках; сюжет о самом документе требует исключения"
patterns = ["\\b(строка|акт|запись|перепись|ревизия|список|метрика|документ|карточка|свидетельство)\\b"]
flags = ["IGNORECASE"]
fields = ["text", "title", "caption"]
quoted = "literal-exempt"

[language.lexicon.date_opening]
rule = "TASTE-NUMBERS"
check = "numbers-and-dates"
purpose = "начало с даты или времени года; правило композиции задаёт каталог"
patterns = ["^(\\d|(в|во|к)\\s+\\d{3,4}|(в|к)\\s+[^.!?]{0,25}\\s(году|годах|веке)\\b|(весной|летом|осенью|зимой|в начале|в конце)\\s+(\\d|[^.!?]{0,15}\\d{4})|(январ|феврал|март|апрел|ма[йя]|июн|июл|август|сентябр|октябр|ноябр|декабр))"]
flags = ["IGNORECASE"]
fields = ["text", "title", "caption"]
quoted = "literal-exempt"

[language.text]
purpose = "выделять буквальную цитату, вставку оригинального написания и кандидаты на границы предложений"
rule = "TASTE-PARAGRAPHS"
check = "paragraphs"
sentence_split = "(?<=[.!?…])[»”\\\"]?\\s+(?=[«„\\\"(—А-ЯЁA-ZŁŚŻ0-9])"
quote_pairs = [["«", "»"], ["„", "“"], ["„", "”"]]
parentheses = ["(", ")"]

[language.writing]
purpose = "распознавать чужую графику, не запрещая оригиналы имён и цитат"
rule = "TASTE-NAMES"
check = "name-forms"
alphabet = "кириллица; исходная графика сохраняется в документе и цитате"
foreign_word = "[A-Za-zÀ-ɏ][A-Za-zÀ-ɏ'’.-]*"
quote_lead = "(по-польски|по-латыни|подписал\\w*|расписал\\w*|вывел сам|слово)[^.!?«»]{0,15}[:—-]?\\s*$"
roman_numeral = "^[IVXLCDM]+\\.?$"
name_before = "\\b[A-ZА-ЯЁŁŚŻ][a-zа-яёąćęłńóśźż]+\\s$"
spelling_change = "\\bбыл\\s+$"
policy = "выбор графики и первой вставки — настройки семьи; имени из букв не восстанавливать"

[language.surnames]
purpose = "склонять только известную именительную форму с указанным родом и регулярным классом"
rule = "TASTE-NAMES"
check = "name-forms"
operation = "remove matched terminal suffix; append the suffix for the requested case"
case_order = ["nom", "gen", "dat", "acc", "ins", "prep"]
policy = "вход — фамилия в именительном падеже, род и выбранный класс; не определять род или тождество по окончанию; неизвестный класс — ручная проверка"

[[language.surname_forms]]
id = "sky-m"
gender = "male"
pattern = "ский$"
suffixes = ["ский", "ского", "скому", "ского", "ским", "ском"]

[[language.surname_forms]]
id = "sky-f"
gender = "female"
pattern = "ская$"
suffixes = ["ская", "ской", "ской", "скую", "ской", "ской"]

[[language.surname_forms]]
id = "tsky-m"
gender = "male"
pattern = "цкий$"
suffixes = ["цкий", "цкого", "цкому", "цкого", "цким", "цком"]

[[language.surname_forms]]
id = "tsky-f"
gender = "female"
pattern = "цкая$"
suffixes = ["цкая", "цкой", "цкой", "цкую", "цкой", "цкой"]

[[language.surname_forms]]
id = "ov-m"
gender = "male"
pattern = "ов$"
suffixes = ["ов", "ова", "ову", "ова", "овым", "ове"]

[[language.surname_forms]]
id = "ov-f"
gender = "female"
pattern = "ова$"
suffixes = ["ова", "овой", "овой", "ову", "овой", "овой"]

[[language.surname_forms]]
id = "ev-m"
gender = "male"
pattern = "ев$"
suffixes = ["ев", "ева", "еву", "ева", "евым", "еве"]

[[language.surname_forms]]
id = "ev-f"
gender = "female"
pattern = "ева$"
suffixes = ["ева", "евой", "евой", "еву", "евой", "евой"]

[[language.surname_forms]]
id = "in-m"
gender = "male"
pattern = "ин$"
suffixes = ["ин", "ина", "ину", "ина", "иным", "ине"]

[[language.surname_forms]]
id = "in-f"
gender = "female"
pattern = "ина$"
suffixes = ["ина", "иной", "иной", "ину", "иной", "иной"]

[[language.terms]]
id = "catholic-service"
rule = "TASTE-PREFERRED-TERMS"
check = "preferred-terms"
purpose = "равноценные названия службы в соответствующем католическом контексте; предпочтение семьи не задано"
forms = ["месса", "имша"]
explanation = "служба в костёле"
policy = "не заменять автоматически; семейная настройка выбирает слово; объяснение при первом употреблении"

[[language.terms]]
id = "parish-house"
rule = "TASTE-PLAIN-LANGUAGE"
check = "plain-language"
purpose = "объяснить историческое слово через знакомые слова"
forms = ["плебания", "дом приходского священника"]
explanation = "дом приходского священника"
policy = "объяснение проверяется в той же фразе, а не по всему тексту"

[[language.terms]]
id = "lighting-holder"
rule = "TASTE-PLAIN-LANGUAGE"
check = "plain-language"
purpose = "сохранить предмет эпохи и объяснить его назначение"
forms = ["светец", "держатель для лучины"]
explanation = "держатель для лучины"
policy = "не заменять предмет свечой или лампой: это другая вещь"

# Слова для хозяина семьи: письмо родным, подписи страниц, подтверждение, следующий шаг, сводка.
# Проверки языка этих шаблонов не читают. Базовое обращение на "вы";
# host_informal даёт отдельные формы на "ты" без определения рода адресата. Подставляемые куски стоят после двоеточия или отдельной фразой:
# движок даёт их в именительном падеже, и склонять их шаблон не берётся.
[host]
media_omitted = "Снято ({view}): {item}. Причина: {reason}. {action}"
media_host = "местный показ хозяину"
media_reader = "показ читателям"
media_records = "вырезка"
media_picture = "картинка"
media_figures = "картинка в тексте"
media_game = "документ игры"
media_living = "жив"
media_unknown = "статус жизни неизвестен"
media_protected = "защищённый документ или субъекты не объявлены"
media_action_document = "Уточнить статус жизни или отделить вырезку об умершем. Игра должна опираться на видимую вырезку."
media_action_picture = "Для выдачи посторонним выбрать снимок умерших. Снимки живых остаются в показе семьи."
internal_hidden = "[рабочая ссылка скрыта]"
internal_notice = "Рабочие идентификаторы или пути файлов скрыты; остальной текст показан."
working_view = 'Личный рабочий вид семьи. Здесь сохранены ваши слова и бумаги; это ещё не текст для читателей.'
