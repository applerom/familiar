confirmation = """Что вы подтверждаете

Программа проверяет, как устроен материал. Каждый названный человек и каждая бумага есть в семейном архиве на этом компьютере; слабая догадка не выдаётся за установленный факт; в тексте нет скрытых пометок. Программа сама определяет, кто показан на странице, в том числе на снимках и в документах. Показ семьи рассказывает обо всех без просьб о разрешении. Посторонним без входа о живых и неизвестных — только имя и родство. Адреса и документы, где есть живые, так показать нельзя. Рисунков с живыми людьми и с детьми программа не создаёт. Всё это проверка данных, а не доказательство того, что так было на самом деле.

Остальное проверяет человек: вы или другой читатель, но не автор текста. Прочитайте страницу целиком — вместе с частью для детей и с тем, на чём держится рассказ, — и посмотрите все картинки и подписи на всех языках, на которых страница будет показана. Проверьте, что адреса и документы живых не показаны; что не затронуто то, о чём в семье решили молчать; что каждая сцена опирается на воспоминания или бумаги; что ни один народ и ни одна вера не выставлены виноватыми целиком. Посмотрите, кто на каждой картинке, отмечено ли, что это реконструкция, и где бумаги или догадки расходятся. Автоматическая проверка может пропустить пересказ своими словами, однофамильца и смысл фразы. А если для языка страницы нет нужных словарей, этих проверок не было вовсе.

Подтверждайте только то, что действительно прочитали. Программа проверит, что читатель назван и что это не автор, но не может проверить, что чтение было честным и внимательным. Пока страницу никто не прочитал, она остаётся черновиком, и читателям её обычным путём не отдать. Вы можете открыть её и без чтения, но это отдельное записанное решение, и ошибку в проверке данных оно не отменяет.

Если страницу или важные для безопасности сведения изменили, подтверждение снимается: изменённое нужно прочитать заново. Что публиковать, решаете вы. Копию, которую уже кому-то отправили, программа вернуть не может."""

