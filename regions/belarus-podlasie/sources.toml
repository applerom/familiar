# START_MODULE_CONTRACT: MOD-REGION-BP-SOURCES
# PURPOSE: Tell a researcher of this region which sources exist for a place and a period, what each holds, how to reach it and how its zero reads, with what was actually seen kept apart from what was only retold.
# PRD_REF: docs/PRD.md#LAYERS
# INVARIANTS:
# - source ids are unique, and kind, classes and access come from closed lists [review: pack keeper]
# - pace is never a pack value: a source states what the site publishes, the host's ledger decides the pace [review: engine lead]
# CHANGES_WITH:
# - regions/CONTRACT.md (record shape)
# - MOD-ROLES-RECIPE-SEARCHER (reads a source before its recipe)
# :END_MODULE_CONTRACT
#
# Region: today's Belarus and the Podlaskie borderland of Poland; the old
# governorates of the north-west of the Russian Empire; Minsk as a Soviet city.
# Includes cross-region cemetery, forum and emigration routes relevant to
# this borderland's diaspora. Unknown dates stay [] and never filter planning.

# Only explicit place/country words establish planning geography. A bare town
# is ambiguous; historical borderlands retain all plausible catalogue countries.
[[coverage.places]]
aliases = ["Poland", "Polska", "Польша", "Польши", "Польшча"]
countries = ["PL"]
[[coverage.places]]
aliases = ["Belarus", "Беларусь", "Беларуси", "Białoruś", "Белоруссия", "Белоруссии", "Минская", "Мінская", "Minsk", "Могилёвская", "Могилевская", "Витебская"]
countries = ["BY"]
[[coverage.places]]
aliases = ["Lithuania", "Lietuva", "Litwa", "Литва", "Литвы"]
countries = ["LT"]
[[coverage.places]]
aliases = ["Russia", "Россия", "России", "Rosja"]
countries = ["RU"]
[[coverage.places]]
aliases = ["Ukraine", "Украина", "Украины", "Ukraina"]
countries = ["UA"]
[[coverage.places]]
aliases = ["Grodno", "Гродно", "Гродненская", "Grodzieńska", "Гродненской"]
countries = ["BY", "PL", "LT"]

