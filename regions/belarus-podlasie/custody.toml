[[custody]]
id = "by-liquidated-orgs"
country = "BY"
classes = ["personnel-file"]
years = [1944, 2026]
kept_by = ["minsk-city-archive", "mogilev-regional-archive"]
then = "A reorganised organisation passes its records to the successor; a liquidated one to the territorial archive of the city or district."
closed = "Third persons reach personnel files under the rules on personal secrets (by-personal-secret)."
who_may_ask = "Anyone may apply to a state archive. Requests of a social and legal kind that do not touch property or inheritance rights (confirming service record and pay) are free; a request is biographical and paid when the information is for personal purposes, an exhibition, a publication or research (official archives portal, page on services)."
statute = "Law 323-З, article 12, part 5 (territorial archives receive the records of reorganised and liquidated organisations, except those that must go to state archives)."
status = "verified"
checked = 2026-11-12
basis = "Article 12 read on the legal portal; the page on services of archival institutions read on the official archives portal. Which archive holds a given enterprise is a separate question: find the organisation and its successor first. The Minsk city archive's own page was not obtained."

[[custody]]
id = "by-archives-by-period"
country = "BY"
classes = ["parish-register", "census-revision", "civil-register", "village-council"]
years = [1500, 2026]
kept_by = ["niab", "archives-by", "mogilev-regional-archive"]
then = ""
closed = "Up to about 1920: the national historical archive (Minsk, Grodno). After about 1920: regional and local state archives and the archives of the registry offices."
who_may_ask = "Anyone, including foreign citizens; requests for personal purposes, publications or research are biographical and paid, social and legal certificates not touching property or inheritance are free."
statute = ""
status = "verified"
checked = 2026-11-12
basis = "Guide page on the state archives portal read on 2026-11-11; the page on services read again on 2026-11-12 for who may apply and free against paid requests; the national archive's page on genealogy says that genealogical requests go to the national historical archive: Minsk for the former Minsk, Mogilev, Vitebsk and part of the Grodno governorates, the Grodno branch for the former Grodno governorate and part of the Vilna one."

