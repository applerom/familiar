# START_MODULE_CONTRACT: MOD-REGION-BP-CUSTODY
# PURPOSE: Say where a record of a given class and year is kept now in this region, who may ask for it, how long it stays closed and which fields its form carried, so that a letter is drafted to the right keeper and a paper is not promised fields it never had.
# PRD_REF: docs/PRD.md#LAYERS
# INVARIANTS:
# - every custody record names its keepers by source id, and every id resolves in the pack [review: pack keeper]
# - a closure term or a statute stated as verified names the article it rests on [review: engine lead]
# CHANGES_WITH:
# - regions/CONTRACT.md (record shape)
# - MOD-REGION-BP-SOURCES (keepers)
# - MOD-SKILL-MEMORY-FIRST (RP-1, RP-4, RP-5)
# :END_MODULE_CONTRACT

# ---------- Belarus ----------

[[custody]]
id = "by-civil-term"
country = "BY"
classes = ["civil-register"]
years = [1918, 2026]
kept_by = ["zags-by"]
then = "After the term the records pass to state archives for permanent storage (resolution 610, point 12). First copies are kept in the registry office of the place, second copies in the archives of the registry bodies of the regions and of Minsk."
closed = "Kept for 100 years from the day the record was made (archives law 323-З, article 20, part 2: \"записей актов гражданского состояния – 100 лет\"); the term was raised from 75 to 100 years by law 163-З of 2022-04-18 (announced on the official archives portal on 2022-04-20). Copies of records are not issued to citizens at all (resolution 610, point 115); a citizen gets a repeat certificate or a certificate with data from the record."
who_may_ask = "A certificate with data from a record: the person himself or herself; parents, adopters and guardians for the birth record of a child; relatives or family members for a death record (resolution 610, point 114). In exceptional cases heirs, close relatives and the spouse; any other person only with the approval of the justice department of the region or of Minsk. A representative needs a notarised power of attorney. The request goes in writing to the registry office of residence or to the office or archive that keeps the record (point 87) and is answered in seven days (point 117). When a repeat birth or death certificate is issued the office checks kinship (point 88)."
statute = "Law 323-З on archives and records management of 2011-11-25, article 20, part 2, as amended by 163-З of 2022-04-18 (the list of amending laws on the legal portal also names 134-З of 2026-03-16); resolution 610 of the Council of Ministers of 2025-11-06, in force from 2026-01-01 (points 12, 85-93, 107-120)."
status = "verified"
checked = 2026-11-12
basis = "Law text read on the legal portal (article 20, part 2); resolution 610 read on the legal portal: point 12 (100 years, first and second copies, transfer to state archives), points 87-88 and 114-117; the raise from 75 years read on the official archives portal. Not read: article 202 of the marriage and family code, to which point 86 refers for the circle of persons entitled to a repeat certificate. The earlier note of a resolution of 2005 on the order of transfer is out of date: resolution 610 of 2025 replaces the regulation of that year (the list of repealed acts was not read in full)."

[[custody]]
id = "by-personal-secret"
country = "BY"
classes = ["civil-register", "personnel-file", "repression", "archive-guide"]
years = [1918, 2026]
kept_by = ["archives-by"]
then = ""
closed = "Archival records holding a personal secret are restricted for 75 years from the day they were made (archives law 323-З, article 29, part 2). The restriction may be lifted earlier with the person's consent, and after the person's death with the consent of the heirs, formalised in the set order. The ministry sets the order of access. No separate closure term for civil records was found in the law."
who_may_ask = "The person, and after death the heirs, can consent to earlier access; others reach such records after the term."
statute = "Law 323-З, article 29, part 2."
status = "verified"
checked = 2026-11-12
basis = "Text of the law read on the legal portal, article 29, part 2 (75 years, consent of the person or of the heirs). The access order set by the ministry was not read."

