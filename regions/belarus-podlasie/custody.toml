# ---------- what a form carried (RP-1) ----------

[[form]]
id = "by-birth-certificate-1940s-1950s"
country = "BY"
document = "birth certificate issued to the family"
years = [1940, 1959]
carries = ["child's full name", "date and place of birth", "father's full name with patronymic", "mother's full name with patronymic"]
not_guaranteed = ["parents' places of birth", "parents' ages", "record number on the certificate itself"]
status = "reported"
basis = "One photographed form of the period; the register entry itself (not the certificate) usually carries more: ask for the entry, not a repeat certificate, when places of birth are needed. Rechecked on 2026-11-12: no official specimen of the forms of the 1940s-1950s was found; the forms in force now (ministry of justice, 2025) are not those of the period."

[[form]]
id = "by-marriage-certificate-1940s-1950s"
country = "BY"
document = "marriage certificate issued to the couple"
years = [1940, 1959]
carries = ["both full names", "date of registration", "surname after marriage"]
not_guaranteed = ["ages", "places of birth", "parents"]
status = "unverified"
basis = "Not seen; from the pattern of the birth certificate."


