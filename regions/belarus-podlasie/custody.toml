[[custody]]
id = "by-parish-before-1918"
country = "BY"
classes = ["parish-register"]
years = [1600, 1917]
kept_by = ["niab", "familysearch", "aab", "eais"]
then = ""
closed = "Open. The national historical archive holds the originals; microfilm catalogues of the region are on FamilySearch; second copies of some Catholic deaneries sit in Polish diocesan archives, and older church books in the Lithuanian historical archive."
who_may_ask = "Условия доступа и приёма запросов проверять раздельно для Минска и Гродно по source niab. Внешнее чтение 05.11.2026 сообщает для Минска приостановку генеалогических/тематических заявок с 02.04.2026, биографических от физических лиц с 17.09.2026; чтение 11.11.2026 для Гродно — генеалогических с 01.02.2025. Это не запрет работы читального зала и не правило доступа ко всем книгам."
statute = ""
status = "reported"
checked = 2026-11-11
basis = "Archive pages and the pilot's use of the films and inventories; not a full list of where each parish sits. The national archive's page on genealogy (read 2026-11-12) confirms that the national historical archive serves copies of metric records of birth, marriage and death for its territories. The second copies in a Polish diocesan archive were not confirmed: its inventory list names parish fonds, none of the Grodno deanery. ex-ussr-kinship-research v1.44.0, references/seed-sources.md, строки 250–251; даты чтения 05.11 и 11.11.2026 — чужие наблюдения, нами не проверены."

# ---------- Poland ----------

[[custody]]
id = "pl-civil-term"
country = "PL"
classes = ["civil-register"]
years = [1808, 2026]
kept_by = ["szukajwarchiwach"]
then = "Within 2 years after the term the records are handed to the competent state archive (article 28, part 4). Books kept before the act took force: births after 100 years, marriages and deaths after 80 years from the closing of the book, then into the state archive (articles 128-129)."
closed = "In the registry office: birth records 100 years, marriage and death records 80 years, counted from the end of the calendar year in which the record was made (article 28, parts 1-2). A birth or marriage record of a person for whom no death record exists is kept longer (part 3). How a state archive opens the books after the handover is set by the law on the national archival resource, not read here."
who_may_ask = "A copy or a certificate from the register is issued to the person, the spouse, ascendants, descendants, siblings, the statutory representative, the guardian, a person who shows a legal interest, courts, prosecutors, social organisations when it fits their statutory aim and the public interest, and public authorities for their statutory tasks (article 45, part 1)."
statute = "Act of 2014-11-28 on civil status records (official gazette 2014, item 1741), consolidated text of 2026-03-31, articles 28, 45, 128, 129."
status = "verified"
checked = 2026-11-12
basis = "Consolidated text of the act read from the official file of the parliament's legal database: article 28 (terms, handover within 2 years), article 45 part 1 (circle of persons), articles 128-129 (earlier books). The earlier entry gave the date 2014-09-28 and said the records pass after the term; both are corrected here."

[[custody]]
id = "pl-interwar-east"
country = "PL"
classes = ["parish-register", "civil-register"]
years = [1919, 1939]
kept_by = ["aab", "szukajwarchiwach"]
then = "From 1946-01-01 civil registry offices took over; priests who kept the metric books kept them unless ordered to hand them to an office (decree of 1945, articles 12 and 25)."
closed = "In the parts of the state where civil registration ran through registrars of each faith (the clergy keeping the metric books) it did so until the end of 1945; the introductory decree to the civil status law of 1945 names this system (article 11) and, for Podlasie and the Chełm land, the Orthodox books of before 1915 that stayed with the Catholic parish registrars (article 20)."
who_may_ask = ""
statute = "Decree of 1945-09-25, introductory provisions to the civil status law (official gazette 1945, no. 48, item 273), articles 11, 12, 20, 25 (the decree numbers its articles in capital letters)."
status = "verified"
checked = 2026-11-12
basis = "Text of the decree read from the official scan (articles 11, 12, 20, 23 and 25). The decree speaks of the parts of the state with the confessional system; it does not list the eastern provinces one by one, and that the eastern provinces of interwar Poland belonged to them is general knowledge, not read in this text."

