confirmation = """What you are confirming

The machine checks the form of the material: named people and papers resolve to local items, weak versions are not presented as accepted facts, and text has no hidden markup. It computes who is shown, including people in pictures and papers. The family display tells stories about everyone. Public output gives outsiders only names and kinship for living or unknown people. Addresses and documents involving living people cannot be released through these checks. Generated pictures of living people or children are excluded. These are checks of data, not proof of historical truth.

You or a reader other than the author must read the whole page, its children's block and what it rests on, and inspect its pictures and captions in every shown language. Check that the prose excludes living people’s addresses and documents, keeps closed family topics private, tells scenes the evidence can support, and does not blame a whole people or faith. Check who is in each picture, whether reconstruction is labelled, and where the papers or versions disagree. A green automatic check can miss paraphrases, namesakes and meaning; missing language resources mean those checks were not performed.

Confirm only the material you actually read. The engine checks that the reader is named and different from the author; it cannot prove that someone read honestly or independently. If nobody reads it, the page remains a draft, and ordinary reader export is refused. A deliberate release by the host is a separate recorded decision and cannot override a failed data check.

A change to the shown page or relevant safety information invalidates the confirmation. Read the changed material again. You decide what to publish; an outside copy already shared cannot be recalled by the local engine."""

